<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Comfy Router v2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a switchboard. Sticky top nav, one 1120px column, pages swapped by hash; routes drawn as thin lines in the hero. */
:root{
  /* Comfy - Deep Plum on Warm White (Magic Patterns design system). Single light theme by design. */
  --bg:#F0EFED; --panel:#FFFFFF; --ink:#211927; --muted:#55505B; --line:#D9D5DE; --soft:#EAE7EF;
  --accent:#32265F; --accent-hover:#49378B; --accent-ink:#ffffff; --accent-soft:#DBD6F2; --plum-bright:#49378B;
  --amber:#7A4F00; --up:#1E6B45; --down:#B4232F;
  --code-bg:#211927; --code-fg:#F0EFED; --code-dim:#A79FB0; --code-key:#F2FF59; --code-str:#B7DED5;
  --yellow:#F2FF59;
  --display:"PP Formula","Inter Tight","Segoe UI",system-ui,sans-serif;
  --body:"PP Formula","Inter Tight","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme:light;
}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
a{color:var(--accent)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:24px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:18px;color:var(--ink);text-decoration:none}
.brand svg{flex:none}
.preview{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);border:1px solid var(--amber);border-radius:4px;padding:1px 6px}
nav.main{display:flex;gap:4px;flex-wrap:wrap;flex:1}
@media (max-width:640px){header.top .wrap{gap:8px 12px} nav.main{order:3;flex-basis:100%;margin-inline:-10px} header.top .btn.primary{display:none}}
nav.main a{color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:6px;font-weight:500}
nav.main a:hover{color:var(--ink);background:var(--soft)}
nav.main a[aria-current="page"]{color:var(--ink);background:var(--soft)}
.btn{display:inline-flex;align-items:center;gap:8px;font:600 14px var(--body);padding:9px 16px;border-radius:8px;text-decoration:none;border:1px solid transparent;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:var(--line);color:var(--ink);background:var(--panel)}
.btn:focus-visible,a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:40px 64px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.12}
h1{font-size:clamp(32px,5vw,54px);font-weight:700;letter-spacing:-.02em}
h2{font-size:clamp(24px,3vw,32px);font-weight:700;letter-spacing:-.01em}
h3{font-size:19px;font-weight:600}
p{margin:0}
.lede{font-size:18px;color:var(--muted);max-width:62ch}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.section{display:flex;flex-direction:column;gap:20px;margin-top:56px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
.small{font-size:13px}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px;align-items:center}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.hero-title{font-size:clamp(40px,6.2vw,68px);line-height:1.02}
.hero-sub{font-size:clamp(18px,2vw,22px);color:var(--muted);max-width:30ch;line-height:1.4}
.hero-sub em{font-style:normal;color:var(--ink);font-weight:600}
.madeby{align-self:flex-start;display:inline-flex;align-items:center;gap:10px;font:700 17px var(--display);letter-spacing:.01em;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:6px 18px 6px 7px;box-shadow:0 6px 18px -8px var(--accent)}
.hero h1 em{font-style:normal;color:var(--accent)}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.routes{width:100%;height:auto;max-width:100%}
.routes text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.routes .hub text{fill:var(--accent-ink);font-weight:500}
@media (prefers-reduced-motion:no-preference){.routes .pulse{animation:dash 3.2s linear infinite}}
@keyframes dash{to{stroke-dashoffset:-40}}
.routes.nodes .nt{font:600 11px var(--body);fill:#e6e6e6}.routes.nodes .ns{font:10px var(--mono);fill:#bdbdbd}.routes.nodes .nw{font:10px var(--mono);fill:#8c8c8c}.routes.nodes .nv{font:10px var(--mono);fill:#e6e6e6}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.ltd{display:inline-block;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--amber);border:1px solid var(--amber);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.note .ltd{margin:0 6px 0 0}
.pillar .num{font-family:var(--mono);color:var(--accent);font-size:13px}
pre.code{background:var(--code-bg);color:var(--code-fg);border-radius:12px;padding:18px 20px;margin:0;overflow-x:auto;font:13px/1.6 var(--mono)}
pre.code .k{color:var(--code-key)} pre.code .s{color:var(--code-str)} pre.code .c{color:var(--code-dim)}
.codehead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.copy{font:500 12px var(--mono);background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:3px 8px;cursor:pointer}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.mini ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.mini li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:baseline}
.mini li .r{font-family:var(--mono);color:var(--muted);font-size:13px}
.mini li a{color:var(--ink);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini li a:hover{color:var(--accent)}
.makers{display:flex;flex-wrap:wrap;gap:8px 20px;font-family:var(--display);font-weight:500;font-size:17px;color:var(--muted)}
/* tabs & tables */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{font:600 15px var(--body);background:none;border:none;color:var(--muted);padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{font:500 13px var(--body);background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:5px 12px;border-radius:999px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tablebox{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font:500 12px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--soft)}
tr:last-child td{border-bottom:none}
td a.m{color:var(--ink);font-weight:600;text-decoration:none}
td a.m:hover{color:var(--accent);text-decoration:underline}
td .id{display:block;font:12px var(--mono);color:var(--muted);text-decoration:none}
td a.id:hover{color:var(--accent);text-decoration:underline}
.hub{font-size:11px;margin-left:4px;color:var(--muted)}
.rank{font-family:var(--mono);font-weight:500;width:44px}
.share{min-width:180px}
.bar{display:flex;align-items:center;gap:10px}
.bar span.b{height:8px;border-radius:4px;background:var(--accent);flex:none}
.bar span.v{font-family:var(--mono);font-size:13px}
.chg{font-family:var(--mono);font-size:13px;white-space:nowrap}
.chg.up{color:var(--up)} .chg.down{color:var(--down)} .chg.new{color:var(--amber)} .chg.same{color:var(--muted)}
.showall{align-self:flex-start}
.note{font-size:13px;color:var(--muted);max-width:80ch}
/* model page */
.crumbs{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.crumbs a{color:var(--muted)}
.idline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.idline code{font:14px var(--mono);background:var(--soft);padding:4px 8px;border-radius:6px;word-break:break-all}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.facts div{background:var(--panel);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.facts dt{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.big{font-family:var(--display);font-size:30px;font-weight:700}
.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
/* pricing */
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.filters input,.filters select{font:14px var(--body);padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);min-width:0}
.filters input{flex:1 1 240px}
.per{font-size:12px;color:var(--muted);margin-left:2px}
.spec{display:block;font-size:12px;color:var(--muted)}
.mk{display:flex;flex-direction:column;gap:2px}
.mk .per{display:inline}
a.ext{font-size:13px;white-space:nowrap}
tr.grp th{background:var(--panel);font:600 15px var(--display);letter-spacing:0;text-transform:none;color:var(--ink);padding-top:20px;border-bottom:1px solid var(--line)}
tr.grp .cnt{font:12px var(--mono);color:var(--muted);margin-left:6px}
table.price td{vertical-align:top}
.faq{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line);padding-block:14px}
.faq summary{cursor:pointer;font-weight:600}
.faq p{margin-top:8px;max-width:70ch}
.na{color:var(--muted);font-size:13px}
/* use cases */
.uc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:24px;padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
@media (max-width:760px){.uc{grid-template-columns:1fr}}
.uc ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.uc .models{display:flex;flex-wrap:wrap;gap:8px}
.onekey{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:820px){.onekey{grid-template-columns:1fr}}
.onekey figure{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.onekey svg{width:100%;height:auto;max-width:100%}
.onekey .tag{font:600 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:5px}
.onekey .tag.bad{color:var(--down);background:var(--soft)} .onekey .tag.good{color:var(--accent);background:var(--accent-soft)}
.onekey .ok-t{font:500 12px var(--body);fill:var(--ink)} .onekey .ok-a{font:600 12px var(--body);fill:var(--bg)}
.onekey .ok-r{font:700 14px var(--display);fill:var(--accent-ink)} .onekey .ok-c{font:12px var(--mono);fill:var(--muted)}
.ucgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.story{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.thumb{display:block;width:100%;height:auto;max-width:100%;aspect-ratio:16/9}
.score{display:flex;gap:8px;flex-wrap:wrap}
.score div{display:flex;flex-direction:column;background:var(--soft);border-radius:8px;padding:6px 10px;min-width:0}
.score span{font:11px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.score strong{font-family:var(--display);font-size:17px}
.story .models{display:flex;flex-wrap:wrap;gap:6px}
.story .models a{text-decoration:none}
.answer{margin:0;padding:28px 32px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;display:flex;flex-direction:column;gap:14px;max-width:72ch}
.answer p{font-size:19px;line-height:1.6}
.answer p:first-child{font-family:var(--display);font-size:24px;font-weight:600;line-height:1.3}
.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:12px;align-items:center}
.flow .arrow{font-size:24px;color:var(--muted)}
.flow .pill{align-self:flex-start}
@media (max-width:760px){.flow{grid-template-columns:1fr}.flow .arrow{transform:rotate(90deg);justify-self:center}}
footer{border-top:1px solid var(--line);padding-block:28px;color:var(--muted);font-size:13px}
footer .wrap{display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;counter-reset:s}
.steps .card h3::before{counter-increment:s;content:counter(s);display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:600 13px var(--mono);margin-right:10px;vertical-align:2px}
</style>
<style>
/* v1 overrides: Comfy plum-on-grey design system */
body{font-size:15.5px;line-height:1.6;font-weight:400}
h1,h2{font-weight:300;letter-spacing:-.03em;line-height:1.15}
h1{font-size:clamp(36px,5.2vw,66px)}
h2{font-size:clamp(28px,3.4vw,40px)}
h3{font-weight:500;font-size:20px;letter-spacing:0}
.hero-title{font-weight:300;font-size:clamp(44px,6.4vw,76px);line-height:1.02}
.hero h1 em{color:var(--accent);font-weight:500}
.hero-sub em{font-weight:600}
.lede,.hero-sub{color:var(--muted)}
header.top{background:var(--bg);border-bottom:1px solid rgba(33,25,39,.18)}
body::before{background:var(--bg)}
.brand{font-weight:600}
.preview,.ltd{font:800 11px var(--body);letter-spacing:.05em;color:var(--accent);border-color:var(--accent);border-radius:999px;padding:2px 8px}
nav.main a{border-radius:999px;padding:7px 14px;color:var(--ink)}
nav.main a:hover{background:rgba(33,25,39,.08)}
nav.main a[aria-current="page"]{background:var(--ink);color:var(--panel)}
.btn{border-radius:999px;padding:12px 22px;font:600 15px var(--body);min-height:48px;box-sizing:border-box}
.btn.primary:hover{background:var(--accent-hover)}
.btn.ghost{background:transparent;border-color:var(--ink);color:var(--ink)}
.btn.ghost:hover{background:rgba(33,25,39,.06)}
.eyebrow{font:800 13px var(--body);letter-spacing:.05em;color:var(--accent)}
.card{border-radius:24px;padding:28px;border-color:rgba(33,25,39,.14)}
.card:hover{border-color:rgba(73,55,139,.45)}
.tablebox,.facts,.onekey figure{border-radius:24px;border-color:rgba(33,25,39,.14)}
.uc{border-radius:24px;padding:32px;border-color:rgba(33,25,39,.14)}
pre.code{border-radius:20px}
.madeby{font-weight:600;box-shadow:none}
.pill{background:var(--soft);color:var(--ink)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pillar .num{font:800 13px var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.tabs{border-bottom-color:rgba(33,25,39,.2)}
.tabs button{font:500 16px var(--body);color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.chips button{background:var(--panel);border-color:rgba(33,25,39,.18);color:var(--ink)}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
th{background:var(--soft);font:800 11px var(--body);letter-spacing:.05em;color:var(--muted)}
th,td{border-bottom-color:rgba(33,25,39,.12)}
tr.grp th{font:500 18px var(--display)}
.bar span.b{background:var(--accent)}
.big{font-weight:300;letter-spacing:-.03em;font-size:36px}
.filters input,.filters select{border-radius:12px;border-color:rgba(33,25,39,.2);padding:10px 14px}
.copy{border-radius:999px}
.idline code{background:var(--soft)}
.faq summary{font-weight:500;font-size:17px}
a{text-decoration-color:rgba(50,38,95,.35);text-underline-offset:3px}
/* v2: deep plum bands for header, hero and footer */
header.top{background:var(--accent);border-bottom:none}
body::before{background:var(--accent)}
header.top .brand{color:#fff}
header.top .preview{color:#fff;border-color:rgba(255,255,255,.6)}
header.top nav.main a{color:rgba(255,255,255,.82)}
header.top nav.main a:hover{background:rgba(255,255,255,.12);color:#fff}
header.top nav.main a[aria-current="page"]{background:#fff;color:var(--accent)}
header.top .btn.primary{background:#fff;color:var(--accent)}
header.top .btn.primary:hover{background:var(--accent-soft)}
.hero{padding-block:16px 24px}
.card{border-color:var(--line)}
.card:hover{border-color:var(--plum-bright)}
.tablebox,.facts,.onekey figure,.uc{border-color:var(--line)}
footer{background:var(--accent);color:rgba(255,255,255,.8);margin-top:24px;padding-block:28px}
footer a{color:#fff}
th{background:var(--soft)}

.brand .wm{height:22px;width:auto;display:block}
.brand .rt{font-weight:500;letter-spacing:-.01em}
.madeby .wm{height:16px;width:auto;display:block}
.madeby{gap:8px;padding:8px 16px}

.brand .pill-logo{height:40px;width:auto;display:block}
</style>

<body>

function routesSvg() {
  // ComfyUI-style node graph: app -> Comfy Router node -> model nodes, joined by colored noodles
  const C = {STRING: '#7fd38a', IMAGE: '#64b5f6', VIDEO: '#ff9e5e', AUDIO: '#e57ba8', MESH: '#b39ddb'};
  const W = 480, H = 340;
  const node = (x, y, w, title, rows, h) => `<g transform="translate(${x} ${y})">
    <rect width="${w}" height="${h}" rx="7" fill="#353535" stroke="#4a4a4a"/>
    <path d="M7 0 h${w - 14} a7 7 0 0 1 7 7 v15 h-${w} v-15 a7 7 0 0 1 7 -7z" fill="#222"/>
    <circle cx="11" cy="11" r="3.5" fill="#888"/><text x="20" y="15" class="nt">${title}</text>${rows}</g>`;
  const sockL = (y, t, label) => `<circle cx="0" cy="${y}" r="4.5" fill="${C[t]}"/><text x="10" y="${y + 4}" class="ns">${label}</text>`;
  const sockR = (w, y, t, label) => `<circle cx="${w}" cy="${y}" r="4.5" fill="${C[t]}"/><text x="${w - 10}" y="${y + 4}" class="ns" text-anchor="end">${label}</text>`;
  const widget = (w, y, k, v) => `<rect x="8" y="${y - 9}" width="${w - 16}" height="18" rx="9" fill="#222"/><text x="16" y="${y + 4}" class="nw">${k}</text><text x="${w - 16}" y="${y + 4}" class="nv" text-anchor="end">${v}</text>`;
  const wire = (x1, y1, x2, y2, t, pulse) => `<path d="M${x1} ${y1} C${x1 + 45} ${y1} ${x2 - 45} ${y2} ${x2} ${y2}" stroke="${C[t]}" stroke-width="3" fill="none"${pulse ? ' class="pulse" stroke-dasharray="7 5"' : ''}/>`;
  const app = node(14, 132, 104, 'Your app', sockR(104, 40, 'STRING', 'prompt') + widget(104, 62, 'key', '••••'), 76);
  const rx = 160, ry = 96, rw = 132;
  const router = node(rx, ry, rw, 'Comfy Router', sockL(40, 'STRING', 'prompt') + widget(rw, 62, 'model', 'any') +
    sockR(rw, 88, 'IMAGE', 'IMAGE') + sockR(rw, 108, 'VIDEO', 'VIDEO') + sockR(rw, 128, 'AUDIO', 'AUDIO') + sockR(rw, 148, 'MESH', '3D'), 162);
  const outs = [['Nano Banana Pro', 'IMAGE', 22], ['Seedance 2.5', 'VIDEO', 102], ['ElevenLabs v3', 'AUDIO', 182], ['Meshy 7.1', 'MESH', 262]];
  const ox = 340, ow = 126;
  const outNodes = outs.map(([t, k, y]) => node(ox, y, ow, t, sockL(36, k, k === 'MESH' ? '3D' : k), 54)).join('');
  const sy = {IMAGE: 88, VIDEO: 108, AUDIO: 128, MESH: 148};
  const wires = wire(118, 172, rx, ry + 40, 'STRING') + outs.map(([, k, y], i) => wire(rx + rw, ry + sy[k], ox, y + 36, k, i === 1)).join('');
  return `<svg class="routes nodes" viewBox="0 0 ${W} ${H}" role="img" aria-label="ComfyUI-style node graph: your app feeds a Comfy Router node that outputs to image, video, audio and 3D model nodes">
    <defs><pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#2e2e2e"/></pattern></defs>
    <rect width="${W}" height="${H}" rx="14" fill="#1b1b1b"/><rect width="${W}" height="${H}" rx="14" fill="url(#grid)"/>
    ${wires}${app}${router}${outNodes}</svg>`;
}

  const list = DATA.rankings[st.tab][st.uc];
  const rows = st.all ? list : list.slice(0, 10);
  const max = Math.max(...list.map(r => r.share));
  return `
  <div class="stack">
    <span class="eyebrow">Model rankings</span>
    <h1>What builders run on Comfy</h1>
    <p class="lede">Models ranked by share of API usage, ${WIN}. Shares and ranks only. Click a model to open its page on Comfy hub, or its id for API details.</p>
  </div>
  <section class="section" style="margin-top:32px">

    ${subs.length > 1 ? `<div class="chips" aria-label="Use case">${subs.map(u => `<button type="button" aria-pressed="${u === st.uc}" data-setuc="${esc(u)}">${u === 'All' ? 'All use cases' : esc(u)}</button>`).join('')}</div>` : ''}
    <div class="tablebox"><table>
      <thead><tr><th>#</th><th>Model</th><th>Maker</th><th>Share of usage</th><th>vs ${esc(PREV)}</th></tr></thead>
      <tbody>${rows.map(r => `<tr><td class="rank">${r.rank}</td><td>${link(r.id)}${idLink(r.id)}</td><td>${esc(M[r.id].makerName)}</td>
        <td class="share"><div class="bar"><span class="b" style="width:${Math.max(2, 120 * r.share / max).toFixed(1)}px"></span><span class="v">${r.share < 0.1 ? '<0.1' : r.share.toFixed(1)}%</span></div></td><td>${chg(r)}</td></tr>`).join('')}</tbody>
    </table></div>
    ${list.length > 10 ? `<button class="btn ghost showall" type="button" data-toggleall>${st.all ? 'Show top 10' : `Show all ${list.length}`}</button>` : ''}
    <p class="note">Share of credits spent on each model across Comfy API calls to models available on the Router, ${WIN}, compared with ${PREV}. Models offered by several hosts are counted under the model maker. Absolute volumes are not published.</p>
  </section>`;
}

/* ---------- Pricing ---------- */
const GROUPS = ['Image generation', 'Image editing & enhancement', 'Video generation', 'Video editing & enhancement', 'Avatar & lip sync', 'Speech & sound', '3D', 'Omni (multimodal)'];
const NOUN = {image: 'images', second: 'seconds', '1K characters': 'K characters', minute: 'minutes'};
function startPrice(m) {
  const p = m.price;
  if (!p) return '<span class="na">Maker’s list price</span>';
  return `<span class="mono">${usd(p.usd)}</span><span class="per">/${esc(p.unit)}</span>${p.spec ? `<span class="spec">${esc(p.spec)}</span>` : ''}`;
}
function perDollar(m) {
  const p = m.price;
  if (!p || !NOUN[p.unit]) return '<span class="na">–</span>';
  const n = 1 / p.usd;
  return `<span class="mono">${n >= 100 ? Math.round(n).toLocaleString() : n >= 10 ? n.toFixed(0) : n.toFixed(1)}</span> <span class="per">${NOUN[p.unit]}</span>`;
}
function makerCell(m) {
  const ok = m.price ? '<span class="chg up">✓ Same as maker</span>' : '';
  const ln = m.makerUrl ? `<a class="ext" href="${esc(m.makerUrl)}">${esc(m.makerPriceOf)} pricing ↗</a>` : '<span class="na">No public API page</span>';
  return `<div class="mk">${ok}${ln}</div>`;
}
function pricingRows() {
  const q = st.q.trim().toLowerCase();
  let out = '';
  for (const g of GROUPS) {
    if (st.type !== 'All' && st.type !== g) continue;
    const l = DATA.models.filter(m => m.type === g && (!q || (m.name + ' ' + m.id + ' ' + m.makerName).toLowerCase().includes(q)))
      .sort((a, b) => (b.price ? 1 : 0) - (a.price ? 1 : 0) || a.name.localeCompare(b.name));
    if (!l.length) continue;
    out += `<tr class="grp"><th colspan="4" scope="colgroup">${esc(g)} <span class="cnt">${l.length}</span></th></tr>` + l.map(m => `<tr><td>${link(m.id)}${idLink(m.id)}</td>
      <td>${startPrice(m)}</td><td>${perDollar(m)}</td><td>${makerCell(m)}</td></tr>`).join('');
  }
  return out || `<tr><td colspan="4" class="muted">No models match “${esc(st.q)}”. Try a maker name such as Kling or ElevenLabs.</td></tr>`;
}
function pricing() {
  const faq = [['How does billing work?', 'Buy credits up front, then each call is charged at the model maker’s own list price: per image, per second of video, per 1K characters or per million tokens. 211 credits = $1.'],

    </div>
    <p class="note">If volume doesn’t get there, prices go up a little rather than the product going away.</p>
    <div class="cta"><a class="btn primary" href="#pricing">See list prices</a><a class="btn ghost" href="#rankings">See what people use</a></div>
  </section>`;
}

/* ---------- router ---------- */
const app = document.getElementById('app');
function render() {
  const h = location.hash.slice(1) || 'home';
  let html, nav = h;
  if (h === 'rankings') html = rankings();
  else if (h === 'pricing') html = pricing();
  else if (h === 'docs') html = docs();
  else if (h === 'use-cases') html = usecases();
  else if (h === 'why-cheap') html = whyCheap();
  else if (BYSLUG[h]) { html = modelPage(BYSLUG[h]); nav = 'rankings'; }
  else { html = home(); nav = 'home'; }
  app.innerHTML = html;
  document.querySelectorAll('[data-nav]').forEach(a => a.dataset.nav === nav ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
}
let lastHash = location.hash;
window.addEventListener('hashchange', () => { render(); if (location.hash !== lastHash) window.scrollTo(0, 0); lastHash = location.hash; });
app.addEventListener('click', e => {
  const t = e.target.closest('[data-settab],[data-setuc],[data-toggleall],[data-copy],[data-tab],[data-scrollto]');
  if (!t) return;
  if (t.dataset.scrollto) { document.getElementById(t.dataset.scrollto)?.scrollIntoView({behavior: 'smooth'}); return; }
  if (t.dataset.tab) { st.tab = t.dataset.tab; st.uc = 'All'; st.all = false; return; }
  if (t.dataset.settab) { st.tab = t.dataset.settab; st.uc = 'All'; st.all = false; }
  else if (t.dataset.setuc) { st.uc = t.dataset.setuc; st.all = false; }
  else if (t.hasAttribute('data-toggleall')) st.all = !st.all;
  else if (t.dataset.copy != null) {
    const txt = t.dataset.copy;
    const done = () => { t.textContent = 'Copied'; setTimeout(() => t.textContent = 'Copy', 1400); };
    try { navigator.clipboard.writeText(txt).then(done, () => { t.textContent = 'Select and copy'; }); } catch { t.textContent = 'Select and copy'; }
    return;
  }
  render();
});
app.addEventListener('input', e => {
  if (e.target.id === 'pq') { st.q = e.target.value; document.getElementById('ptb').innerHTML = pricingRows(); }
});
app.addEventListener('change', e => {
  if (e.target.id === 'pt') { st.type = e.target.value; document.getElementById('ptb').innerHTML = pricingRows(); }
});
render();
</script>
